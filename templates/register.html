{% extends "base.html" %}
{% block title %}Créer un compte — Profit{% endblock %}
{% block content %}
<div class="container">
  <div class="auth-card">
    <h2>Créer un compte</h2>
    <form id="register-form">
      <div class="field">
        <label for="email">Adresse email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" autocomplete="new-password" minlength="10" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;">Créer mon compte</button>
      <p class="error-msg" id="register-error"></p>
    </form>
    <p style="text-align:center; font-size: 13px; color: var(--paper-dim);">
      Déjà un compte ? <a href="{{ url_for('login_page') }}">Se connecter</a>
    </p>
  </div>
</div>

<script>
const csrfToken = document.querySelector('meta[name="csrf-token"]').content;

document.getElementById('register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('register-error');
  errorEl.textContent = '';

  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      }),
    });
    const data = await res.json();
    if (!res.ok) {
      errorEl.textContent = data.error || 'Inscription impossible.';
      return;
    }
    window.location.href = '/';
  } catch (err) {
    errorEl.textContent = 'Erreur réseau, réessayez.';
  }
});
</script>
{% endblock %}
