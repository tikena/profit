{% extends "base.html" %}
{% block title %}Connexion — Profit{% endblock %}
{% block content %}
<div class="container">
  <div class="auth-card">
    <h2>Connexion</h2>
    <form id="login-form">
      <div class="field">
        <label for="email">Adresse email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;">Se connecter</button>
      <p class="error-msg" id="login-error"></p>
    </form>
    <p style="text-align:center; font-size: 13px; color: var(--paper-dim);">
      Pas encore de compte ? <a href="{{ url_for('register_page') }}">Créer un compte</a>
    </p>
  </div>
</div>

<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('login-error');
  errorEl.textContent = '';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      }),
    });
    const data = await res.json();
    if (!res.ok) {
      errorEl.textContent = data.error || 'Connexion impossible.';
      return;
    }
    window.location.href = '/pricing';
  } catch (err) {
    errorEl.textContent = 'Erreur réseau, réessayez.';
  }
});
</script>
{% endblock %}
